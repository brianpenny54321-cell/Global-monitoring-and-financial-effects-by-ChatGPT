name: Free local AI coding agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  agent:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/agent' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ollama and start local model server
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
      - name: Generate, validate, and propose a patch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OLLAMA_MODEL: qwen2.5-coder:3b
        run: python scripts/free_agent.py
      - name: Report a failed run on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "The free local AI agent run failed or produced an invalid patch. No changes were merged. See the failed GitHub Actions run for logs, then revise the request and comment `/agent` to retry."
