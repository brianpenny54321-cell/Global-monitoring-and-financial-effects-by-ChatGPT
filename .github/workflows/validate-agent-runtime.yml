name: Validate Cloudflare agent runtime

on:
  pull_request:
    paths:
      - "cloudflare/agent-runtime/**"
      - ".github/workflows/validate-agent-runtime.yml"
      - ".github/workflows/deploy-agent-runtime-dev.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/agent-runtime/**"
      - ".github/workflows/validate-agent-runtime.yml"
      - ".github/workflows/deploy-agent-runtime-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/agent-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build tooling without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run deterministic tool and input-validation tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
