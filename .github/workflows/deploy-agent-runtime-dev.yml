name: Deploy Cloudflare agent runtime (development only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-agent-runtime-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/docs/cloudflare-agent-runtime-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/agent-runtime
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run checks before deployment
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Verify required credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#AGENT_API_TOKEN}" -ge 32 || { echo "::error::Missing or too-short repository Actions secret AGENT_API_TOKEN (minimum 32 characters)"; exit 1; }

      - name: Deploy only the development Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Configure the development API token as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: printf '%s' "$AGENT_API_TOKEN" | npx wrangler secret put AGENT_API_TOKEN --config wrangler.jsonc

      - name: Report deployed development endpoint
        run: |
          echo "Deployment command completed for Worker global-monitoring-agent-runtime-dev."
          echo "Next verification must test /health, unauthorized access, a live model tool call, and task retrieval."
